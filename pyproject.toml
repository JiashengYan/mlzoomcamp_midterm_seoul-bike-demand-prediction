[project]
name = "seoul-bike-demand"
version = "0.1.0"
description = "One-hour-ahead Seoul bike rental demand with observed history."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2,<3", "pandas>=2.2,<4", "scikit-learn>=1.7,<2",
  "joblib>=1.4,<2", "threadpoolctl>=3,<4", "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1", "matplotlib>=3.9,<4", "tzdata>=2025.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ipykernel>=6,<8", "nbclient>=0.10,<1", "nbformat>=5,<6"]

[project.scripts]
bike-train = "seoul_bike.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seoul_bike"]

[tool.pytest.ini_options]
testpaths = ["tests"]
